name: cachetest
on:
  watch:
    types: [started]
  fork:
  page_build:
  registry_package:
    types: [published, updated]
  push:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: context
        run: |
          echo "EVENT=${{ github.event_name }} ACTOR=${{ github.actor }} REF=${{ github.ref }} SHA=${{ github.sha }}"
      - name: make cache payload
        run: |
          mkdir -p cachedir
          echo "written-by-${{ github.event_name }}-actor-${{ github.actor }}-run-${{ github.run_id }}" > cachedir/marker.txt
      - name: cache save attempt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: cachedir
          key: probe-key-${{ github.event_name }}-${{ github.run_id }}
      - name: restore-any
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: restoredir
          key: probe-key-nonexistent
          restore-keys: probe-key-
